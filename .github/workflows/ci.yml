name: FinanTrack Security & Build CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  audit-and-test:
    name: Security, Quality & Automated Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: TypeScript & Static Lint Verification
        run: npm run lint

      - name: Run Cryptographic, RBAC & Financial Test Suites
        run: npm test

      - name: Production Bundle & Server Compilation
        run: npm run build
